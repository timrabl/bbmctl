name: Security Audit

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:
  push:
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"

env:
  CARGO_TERM_COLOR: always

jobs:
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run security audit
        id: audit
        run: |
          # Ignored advisories and their rationale live in .cargo/audit.toml.
          if cargo audit --deny warnings > audit.log 2>&1; then
            echo "No security vulnerabilities found"
            cat audit.log
          else
            echo "Security vulnerabilities detected"
            cat audit.log
            {
              echo 'report<<AUDIT_EOF'
              cat audit.log
              echo 'AUDIT_EOF'
            } >> "$GITHUB_OUTPUT"
            exit 1
          fi
      # Without this, a scheduled failure is invisible -- nobody watches the
      # Actions tab, so the audit stayed red for over a month. Open (or update)
      # a single tracking issue instead.
      - name: Report failure as issue
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: "Security audit failing on main"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPORT: ${{ steps.audit.outputs.report }}
        run: |
          body=$(printf '`cargo audit` failed on `main`.\n\nRun: %s\n\n```\n%s\n```\n' "$RUN_URL" "$REPORT")
          existing=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$TITLE" --body "$body" --label security
          fi
