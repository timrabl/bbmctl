name: Release

on:
  push:
    branches:
      - main

jobs:
  release-plz-release:
    name: Release to crates.io
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run release-plz
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          # A PAT, not the ephemeral GITHUB_TOKEN: GitHub suppresses
          # workflow-triggering events for actions taken with GITHUB_TOKEN, so
          # the release this step creates would not fire release-binaries.yml
          # or homebrew.yml (see #30). The PAT also makes the release PR
          # trigger CI, which a GITHUB_TOKEN-opened PR does not.
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  release-plz-pr:
    name: Release PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run release-plz
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          # A PAT, not the ephemeral GITHUB_TOKEN: GitHub suppresses
          # workflow-triggering events for actions taken with GITHUB_TOKEN, so
          # the release this step creates would not fire release-binaries.yml
          # or homebrew.yml (see #30). The PAT also makes the release PR
          # trigger CI, which a GITHUB_TOKEN-opened PR does not.
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
