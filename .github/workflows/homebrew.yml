name: Update Homebrew Formula

on:
  release:
    types: [published]

jobs:
  homebrew:
    name: Update Homebrew formula
    if: "!github.event.release.prerelease"
    runs-on: ubuntu-latest
    steps:
      - name: Update Homebrew formula
        uses: dawidd6/action-homebrew-bump-formula@v4
        with:
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          tap: timrabl/tap
          formula: bbmctl
          tag: ${{ github.ref_name }}
