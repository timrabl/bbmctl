[advisories]
# RUSTSEC-2023-0071 -- "Marvin Attack" timing sidechannel in the `rsa` crate.
#
# Not exploitable here: `rsa` is present in Cargo.lock but is NOT in our
# dependency graph. `cargo tree -i rsa --target all -e all` returns nothing.
# It is an optional dependency of `sqlx-mysql`, which is never enabled --
# bbmctl-database uses sea-orm with only the `sqlx-sqlite` feature.
#
# (An earlier commit recorded this as "transitive dep from rustls". That was
# incorrect; rustls does not depend on the `rsa` crate.)
#
# There is no fixed upstream version, so this cannot be resolved by upgrading.
# Re-evaluate if a MySQL/Postgres backend is ever added, at which point `rsa`
# becomes genuinely reachable and this ignore must be removed.
#
# RUSTSEC-2026-0235 -- out-of-bounds reads validating Rc/Arc in `rkyv` 0.7.
#
# Not exploitable here: `rkyv` is present in Cargo.lock but is NOT in our
# dependency graph. `cargo tree -i rkyv --target all -e all` returns nothing.
# It is an optional dependency of `rust_decimal` (pulled transitively through
# sea-orm); the `rkyv` feature is never enabled, so no rkyv code is compiled.
#
# The fix requires rkyv >= 0.8.17, but rust_decimal 1.42 pins its optional
# dependency to `^0.7`, so the vulnerable version cannot be upgraded away while
# the feature stays off. Since nothing enables it, that is moot.
# Re-evaluate when rust_decimal moves its optional rkyv dependency to 0.8, at
# which point this ignore should be removed.
#
# RUSTSEC-2026-0459 -- bundled SQLite < 3.54.0 can return uninitialized
# page-cache memory when it opens a database together with a crafted `-wal`
# file whose page size differs (CVE-2026-119375).
#
# Unlike the two entries above, this code IS compiled in: sqlx-sqlite enables
# `libsqlite3-sys/bundled`. The exposure is still minimal. bbmctl only opens
# ~/.bbmctl/measurements.db or a path the user passes explicitly, and an
# attacker must already be able to write both the database and its `-wal`
# file there. Anyone with that access to the home directory has worse options.
#
# The fix is libsqlite3-sys >= 0.39, but sqlx-sqlite 0.9.0 (the latest release,
# pulled in through sea-orm 2.0) caps it at `<0.38.0`. sqlx main already widens
# the range to `<0.40.0`. Tracked in #72: remove this ignore and run
# `cargo update -p libsqlite3-sys` as soon as a sqlx release with that range
# is out.
ignore = ["RUSTSEC-2023-0071", "RUSTSEC-2026-0235", "RUSTSEC-2026-0459"]
